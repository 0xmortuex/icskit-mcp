[project]
name = "icskit-mcp"
version = "0.1.0"
description = "MCP server for local .ics calendar files: agenda, search, free time, conflicts and safe edits, with its own RFC 5545 parser and recurrence engine. No accounts, no network."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "0xmortuex" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "tzdata>=2024.1",
]
keywords = ["mcp", "ical", "ics", "calendar", "rfc5545", "rrule", "free-busy", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
]

[project.optional-dependencies]
# python-dateutil is only a test oracle: the recurrence engine is our own.
test = ["pytest>=7", "anyio", "python-dateutil>=2.8"]

[project.urls]
Homepage = "https://github.com/0xmortuex/icskit-mcp"

[project.scripts]
icskit-mcp = "icskit_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icskit_mcp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
markers = ["slow: performance tests with large generated calendars"]
